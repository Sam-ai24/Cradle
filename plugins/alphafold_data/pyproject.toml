[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-plugin-alphafold-data"
version = "0.0.0"
description = "AlphaFold DB data connector for Cradle (predicted structure, CC BY 4.0)."
requires-python = ">=3.11"
dependencies = ["cradle-core"]

[project.entry-points."cradle.data_connectors"]
alphafold-db = "alphafold_data.connector:AlphaFoldDbConnector"

[tool.setuptools.packages.find]
where = ["src"]
