[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-plugin-biogrid-data"
version = "0.0.0"
description = "BioGRID data connector for Cradle (protein-protein interaction, MIT). Requires a free registered API key."
requires-python = ">=3.11"
dependencies = ["cradle-core"]

[project.entry-points."cradle.data_connectors"]
biogrid = "biogrid_data.connector:BioGridConnector"

[tool.setuptools.packages.find]
where = ["src"]
