[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-plugin-biomodels-data"
version = "0.0.0"
description = "BioModels data connector for Cradle (curated SBML models, CC0)."
requires-python = ">=3.11"
dependencies = ["cradle-core"]

[project.entry-points."cradle.data_connectors"]
biomodels = "biomodels_data.connector:BioModelsConnector"

[tool.setuptools.packages.find]
where = ["src"]
