[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-plugin-cellxgene-data"
version = "0.0.0"
description = "CZ CELLxGENE Discover data connector for Cradle (single-cell dataset/collection metadata, code MIT / data CC-BY)."
requires-python = ">=3.11"
dependencies = ["cradle-core"]

[project.entry-points."cradle.data_connectors"]
cellxgene = "cellxgene_data.connector:CellxgeneDiscoverConnector"

[tool.setuptools.packages.find]
where = ["src"]
