[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-plugin-depmap-data"
version = "0.0.0"
description = "DepMap Achilles CRISPR gene-fitness-effect data connector for Cradle. Eval/benchmark only - license forbids use to train or enhance ML models."
requires-python = ">=3.11"
dependencies = ["cradle-core"]

[project.entry-points."cradle.data_connectors"]
depmap = "depmap_data.connector:DepMapConnector"

[tool.setuptools.packages.find]
where = ["src"]
