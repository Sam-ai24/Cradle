[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-plugin-ecell4-spatial"
version = "0.0.0"
description = "E-Cell4 (spatiocyte) particle-based spatial-stochastic simulation adapter for Cradle, subprocess-isolated per NOTICE.md (E-Cell4 is GPL-3.0)."
requires-python = ">=3.11"
dependencies = ["cradle-core", "ecell4-base"]

[project.entry-points."cradle.simulation_adapters"]
ecell4-spatiocyte = "ecell4_spatial.adapter:ECell4SpatialAdapter"

[tool.setuptools.packages.find]
where = ["src"]
