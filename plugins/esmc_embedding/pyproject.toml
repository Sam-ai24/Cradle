[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-plugin-esmc-embedding"
version = "0.0.0"
description = "Protein-sequence embedding adapter for Cradle, backed by EvolutionaryScale's ESM Cambrian (ESM-C) 300M model."
requires-python = ">=3.11"
dependencies = ["cradle-core", "esm>=3.2"]

[project.entry-points."cradle.ai_model_adapters"]
esmc = "esmc_embedding.adapter:build_adapter"

[tool.setuptools.packages.find]
where = ["src"]
