[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-plugin-hello-data"
version = "0.0.0"
description = "Reference data-connector plugin proving Cradle's plugin/conformance mechanism."
requires-python = ">=3.11"
dependencies = ["cradle-core"]

[project.entry-points."cradle.data_connectors"]
hello = "hello_data.connector:HelloDataConnector"

[tool.setuptools.packages.find]
where = ["src"]
