[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-plugin-hello-sim"
version = "0.0.0"
description = "Reference simulation-adapter plugin proving Cradle's plugin/conformance mechanism."
requires-python = ">=3.11"
dependencies = ["cradle-core"]

[project.entry-points."cradle.simulation_adapters"]
hello = "hello_sim.adapter:HelloSimulationAdapter"

[tool.setuptools.packages.find]
where = ["src"]
