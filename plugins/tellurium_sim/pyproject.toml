[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-plugin-tellurium-sim"
version = "0.0.0"
description = "Tellurium/libRoadRunner simulation adapter for Cradle (default ODE/SSA engine)."
requires-python = ">=3.11"
dependencies = ["cradle-core", "tellurium>=2.2"]

[project.entry-points."cradle.simulation_adapters"]
tellurium = "tellurium_sim.adapter:TelluriumSimulationAdapter"

[tool.setuptools.packages.find]
where = ["src"]
