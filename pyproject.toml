[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cradle-core"
version = "0.0.0"
description = "Cradle core: contracts, plugin registry, and conformance testing for a swappable cell-simulation platform."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "antimony>=3.1",
    "python-libsbml>=5.21",
    "python-libsedml>=2.0",
    "python-libcombine>=0.2",
    "h5py>=3.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Not a permanent core dependency: used in Phase 1 only to execute a COMBINE
# archive end-to-end and prove the substrate round-trips. Phase 2 replaces
# this with a proper Tellurium/libRoadRunner SimulationAdapter behind the
# BioSimulators-style contract (Architecture, Layer 4).
demo = ["tellurium>=2.2"]
# Phase 11: the lab-facing notebook API's core (cradle.lab.api, .report) has
# no extra dependencies beyond core Cradle. This extra is only for the
# interactive ipywidgets explorer (cradle.lab.widgets) and for actually
# running/authoring notebooks against it — matching the same "optional,
# graceful" shape Phase 5 established for AI provider keys.
lab = [
    "ipywidgets>=8.1",
    "jupyterlab>=4.2",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "matplotlib>=3.8",
]
# Phase 11: workflows/Snakefile is the actually-runnable multi-step pipeline
# executor on Windows. workflows/lab_pipeline.cwl is an equivalent, real CWL
# document (same 4 scripts/lab_pipeline/*.py steps) kept for portability to
# a Linux/WSL/CI runner, but `cwltool` does not run natively on Windows —
# confirmed directly (its own Singularity-client dependency crashes on
# import, and past that its input-staging step needs a Windows privilege a
# normal account doesn't hold) — so it's deliberately not listed here.
pipelines = ["snakemake>=8.0"]
# Phase 10/12: the Explorer backend (viz/server.py) - a real FastAPI app
# over the plugin registry, not a static-file demo, so it needs an actual
# ASGI server. `watchfiles` here is its CLI (scripts/run_explorer.ps1),
# used instead of `uvicorn --reload`, whose Windows multiprocessing
# reloader was confirmed to get stuck mid-restart (see git history).
viz = ["fastapi>=0.110", "uvicorn>=0.29", "watchfiles>=0.21"]

[project.scripts]
cradle-conformance = "cradle.conformance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
